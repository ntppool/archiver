when:
  - event: [push, pull_request, tag, manual]

variables:
  - &go_env
    GOMODCACHE: /go/pkg/mod
    GOCACHE: /go/pkg/cache
  - &go_volumes
    - go-pkg:/go/pkg

steps:
  - name: test
    image: golang:1.25.14
    pull: true
    environment: *go_env
    volumes: *go_volumes
    commands:
      - go test -v
      - go build
      - go mod vendor

  - name: generate-tags
    image: ghcr.io/abh/woodpecker-docker-tags-plugin:0.2.1-abh
    pull: true
    settings:
      tags: |
        branch
        sha
        edge -v latest
        semver --auto

  - name: docker
    image: woodpeckerci/plugin-kaniko:2.3.2
    pull: true
    settings:
      dockerfile: Dockerfile
      registry: harbor.ntppool.org
      repo: ntppool/archiver
      cache: true
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
