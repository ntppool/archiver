when:
  - event: [push, pull_request, tag, manual]

variables:
  - &go_env
    GOMODCACHE: /go/pkg/mod
    GOCACHE: /go/pkg/cache
  - &go_volumes
    - go-pkg:/go/pkg

steps:
  - name: test
    image: golang:1.25.14
    pull: true
    environment: *go_env
    volumes: *go_volumes
    commands:
      - go test -v
      - go build
      - go mod vendor

  - name: docker
    image: harbor.ntppool.org/ntppool/drone-kaniko:main
    pull: true
    settings:
      repo: ntppool/archiver
      registry: harbor.ntppool.org
      auto_tag: true
      tags: SHA7,${CI_COMMIT_SOURCE_BRANCH}
      cache: true
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
